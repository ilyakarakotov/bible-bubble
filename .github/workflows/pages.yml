# Publishes the app to GitHub Pages on every push to main.
#
# The first run provisions the Pages site itself (see `enablement` below), so
# there is no Settings toggle to flip by hand. The app is plain static files,
# so there is nothing to build.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Provision the Pages site on the first run instead of requiring the
          # Settings -> Pages toggle to be flipped by hand beforehand.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
